<!DOCTYPE html>
<html lang="fi">

<body>

  <header class="site-header">

  <div id="map"></div>

  <div class="map-panel search-panel">
    <div class="search-box">
      <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 0 4.9 14.32l5.39 5.39a1 1 0 0 0 1.42-1.42l-5.39-5.39A8 8 0 0 0 10 2Zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12Z"/></svg>

  </div>

  <div id="status-chip" class="map-panel status-chip">
    <span class="pulse"></span>
    <span id="status-text">Ladataan junia…</span>
  </div>

  <div id="follow-chip" class="map-panel follow-chip">

    <button id="follow-stop" title="Lopeta seuranta" aria-label="Lopeta seuranta">✕</button>

  <div class="map-panel map-legend">
    <div class="lg-title">Junat kartalla</div>
    <div><span class="cat-dot kauko"></span>Kaukojuna</div>
    <div><span class="cat-dot lahi"></span>Lähijuna</div>
    <div><span class="cat-dot tavara"></span>Tavarajuna</div>
    <div><span class="cat-dot muu"></span>Muu liikenne</div>

  <script src="vendor/leaflet/leaflet.js"></script>
