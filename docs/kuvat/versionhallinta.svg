<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="nuoli" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Tausta -->
  <rect x="0" y="0" width="900" height="320" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="36" fill="#e6edf3" font-size="16" font-weight="700">Versionhallinnan ja julkaisun kulku</text>

  <!-- Haaraviivat -->
  <!-- main -->
  <line x1="70" y1="100" x2="600" y2="100" stroke="#3987e5" stroke-width="3"/>
  <!-- haarautuminen featureen -->
  <path d="M 90 100 C 140 100 140 190 190 190" fill="none" stroke="#22c1a8" stroke-width="3"/>
  <!-- feature-haara -->
  <line x1="190" y1="190" x2="420" y2="190" stroke="#22c1a8" stroke-width="3"/>
  <!-- merge takaisin mainiin -->
  <path d="M 420 190 C 470 190 470 100 520 100" fill="none" stroke="#22c1a8" stroke-width="3"/>

  <!-- Committipisteet: main -->
  <circle cx="90" cy="100" r="8" fill="#3987e5" stroke="#0d1117" stroke-width="2.5"/>
  <circle cx="520" cy="100" r="8" fill="#3987e5" stroke="#0d1117" stroke-width="2.5"/>

  <!-- Committipisteet: feature -->
  <circle cx="240" cy="190" r="8" fill="#22c1a8" stroke="#0d1117" stroke-width="2.5"/>
  <circle cx="400" cy="190" r="8" fill="#22c1a8" stroke="#0d1117" stroke-width="2.5"/>

  <!-- Haaranimet -->
  <text x="70" y="82" fill="#79b8ff" font-size="13" font-weight="700">main</text>
  <text x="190" y="222" fill="#56d4bc" font-size="12.5" font-weight="600">claude/finnish-train-map-app-pefo7b</text>

  <!-- Committien selitteet -->
  <text x="90" y="130" fill="#8b949e" font-size="12" text-anchor="middle">
    <tspan x="90" dy="0">ee1dd3f</tspan>
    <tspan x="90" dy="15">Initial commit</tspan>
  </text>
  <text x="240" y="240" fill="#8b949e" font-size="12" text-anchor="middle">
    <tspan x="240" dy="0">f3012fa</tspan>
    <tspan x="240" dy="15">Junakartta-sovellus</tspan>
  </text>
  <text x="400" y="240" fill="#8b949e" font-size="12" text-anchor="middle">
    <tspan x="400" dy="0">b7e117c</tspan>
    <tspan x="400" dy="15">Pages-työnkulku</tspan>
  </text>
  <text x="520" y="76" fill="#8b949e" font-size="12" text-anchor="middle">
    <tspan x="520" dy="0">24256ee &#8226; Merge PR #1</tspan>
  </text>

  <!-- Nuoli Actionsiin -->
  <line x1="600" y1="100" x2="648" y2="100" stroke="#8b949e" stroke-width="2" marker-end="url(#nuoli)"/>

  <!-- GitHub Actions -laatikko -->
  <rect x="655" y="66" width="210" height="66" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="760" y="94" fill="#e6edf3" font-size="13.5" font-weight="700" text-anchor="middle">GitHub Actions</text>
  <text x="760" y="114" fill="#8b949e" font-size="12" text-anchor="middle">.github/workflows/pages.yml</text>

  <!-- Nuoli Pagesiin -->
  <line x1="760" y1="132" x2="760" y2="176" stroke="#8b949e" stroke-width="2" marker-end="url(#nuoli)"/>

  <!-- GitHub Pages -laatikko -->
  <rect x="655" y="182" width="210" height="66" rx="10" fill="#12261c" stroke="#238636"/>
  <text x="760" y="210" fill="#e6edf3" font-size="13.5" font-weight="700" text-anchor="middle">GitHub Pages</text>
  <text x="760" y="230" fill="#7ee2a8" font-size="11.5" text-anchor="middle">paanpe.github.io/claude_junat</text>

  <!-- Selite -->
  <text x="24" y="292" fill="#8b949e" font-size="12.5">
    Kehitys tehdään feature-haarassa &#8594; muutokset yhdistetään pull requestilla main-haaraan &#8594; jokainen push main-haaraan julkaisee sivuston automaattisesti.
  </text>
</svg>
