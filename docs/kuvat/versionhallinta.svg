<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="nuoli" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Tausta -->
  <rect x="0" y="0" width="1000" height="360" rx="14" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="38" fill="#e6edf3" font-size="16" font-weight="700">Versionhallinnan ja julkaisun kulku</text>

  <!-- main-haara -->
  <line x1="60" y1="100" x2="800" y2="100" stroke="#3987e5" stroke-width="3"/>
  <text x="60" y="82" fill="#79b8ff" font-size="13" font-weight="700">main</text>

  <!-- Feature-haaran jaksot (sama haara aloitetaan uudelleen jokaisen mergen jälkeen) -->
  <!-- Jakso 1: sovellus + Pages-työnkulku -> PR #1 -->
  <path d="M 90 100 C 130 100 120 200 150 200" fill="none" stroke="#22c1a8" stroke-width="3"/>
  <line x1="150" y1="200" x2="290" y2="200" stroke="#22c1a8" stroke-width="3"/>
  <path d="M 290 200 C 320 200 310 100 350 100" fill="none" stroke="#22c1a8" stroke-width="3"/>
  <circle cx="200" cy="200" r="7" fill="#22c1a8" stroke="#0d1117" stroke-width="2.5"/>
  <circle cx="255" cy="200" r="7" fill="#22c1a8" stroke="#0d1117" stroke-width="2.5"/>

  <!-- Jakso 2: README + kuvat -> PR #2 -->
  <path d="M 350 100 C 390 100 380 200 410 200" fill="none" stroke="#22c1a8" stroke-width="3"/>
  <line x1="410" y1="200" x2="500" y2="200" stroke="#22c1a8" stroke-width="3"/>
  <path d="M 500 200 C 530 200 520 100 560 100" fill="none" stroke="#22c1a8" stroke-width="3"/>
  <circle cx="455" cy="200" r="7" fill="#22c1a8" stroke="#0d1117" stroke-width="2.5"/>

  <!-- Jakso 3: karttapohja + suodattimet + junatyypit -> PR #3 -->
  <path d="M 560 100 C 600 100 590 200 620 200" fill="none" stroke="#22c1a8" stroke-width="3"/>
  <line x1="620" y1="200" x2="700" y2="200" stroke="#22c1a8" stroke-width="3"/>
  <path d="M 700 200 C 730 200 720 100 760 100" fill="none" stroke="#22c1a8" stroke-width="3"/>
  <circle cx="640" cy="200" r="7" fill="#22c1a8" stroke="#0d1117" stroke-width="2.5"/>
  <circle cx="678" cy="200" r="7" fill="#22c1a8" stroke="#0d1117" stroke-width="2.5"/>

  <!-- main-haaran commitit -->
  <circle cx="90" cy="100" r="8" fill="#3987e5" stroke="#0d1117" stroke-width="2.5"/>
  <circle cx="350" cy="100" r="8" fill="#3987e5" stroke="#0d1117" stroke-width="2.5"/>
  <circle cx="560" cy="100" r="8" fill="#3987e5" stroke="#0d1117" stroke-width="2.5"/>
  <circle cx="760" cy="100" r="8" fill="#3987e5" stroke="#0d1117" stroke-width="2.5"/>

  <!-- Selitteet -->
  <text x="90" y="130" fill="#8b949e" font-size="12" text-anchor="middle">Initial commit</text>
  <text x="350" y="80" fill="#8b949e" font-size="12" text-anchor="middle">Merge PR #1</text>
  <text x="560" y="80" fill="#8b949e" font-size="12" text-anchor="middle">Merge PR #2</text>
  <text x="760" y="80" fill="#8b949e" font-size="12" text-anchor="middle">Merge PR #3</text>

  <text x="220" y="235" fill="#56d4bc" font-size="12" font-weight="600" text-anchor="middle">PR #1: sovellus +</text>
  <text x="220" y="251" fill="#56d4bc" font-size="12" font-weight="600" text-anchor="middle">Pages-työnkulku</text>
  <text x="455" y="235" fill="#56d4bc" font-size="12" font-weight="600" text-anchor="middle">PR #2: README</text>
  <text x="455" y="251" fill="#56d4bc" font-size="12" font-weight="600" text-anchor="middle">+ kuvat</text>
  <text x="660" y="235" fill="#56d4bc" font-size="12" font-weight="600" text-anchor="middle">PR #3: karttapohja,</text>
  <text x="660" y="251" fill="#56d4bc" font-size="12" font-weight="600" text-anchor="middle">suodattimet, junatyypit</text>

  <text x="150" y="180" fill="#56d4bc" font-size="12" font-weight="700">claude/finnish-train-map-app-pefo7b</text>

  <!-- Nuoli Actionsiin -->
  <line x1="770" y1="100" x2="822" y2="100" stroke="#8b949e" stroke-width="2" marker-end="url(#nuoli)"/>

  <!-- GitHub Actions -laatikko -->
  <rect x="828" y="68" width="150" height="62" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="903" y="95" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="middle">GitHub Actions</text>
  <text x="903" y="114" fill="#8b949e" font-size="11.5" text-anchor="middle">pages.yml</text>

  <!-- Nuoli Pagesiin -->
  <line x1="903" y1="130" x2="903" y2="172" stroke="#8b949e" stroke-width="2" marker-end="url(#nuoli)"/>

  <!-- GitHub Pages -laatikko -->
  <rect x="808" y="178" width="190" height="62" rx="10" fill="#12261c" stroke="#238636"/>
  <text x="903" y="205" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="middle">GitHub Pages</text>
  <text x="903" y="224" fill="#7ee2a8" font-size="10.5" text-anchor="middle">paanpe.github.io/claude_junat</text>

  <!-- Selite -->
  <text x="24" y="300" fill="#8b949e" font-size="12.5">
    Kehitys tehdään feature-haarassa ja muutokset yhdistetään pull requesteilla main-haaraan. Jokainen push main-haaraan julkaisee sivuston
  </text>
  <text x="24" y="320" fill="#8b949e" font-size="12.5">
    automaattisesti. Mergen jälkeen feature-haara aloitetaan uudelleen tuoreesta main-haarasta (tai rebasetaan sen päälle).
  </text>
</svg>
